# Combine with "oracle": --spring.profiles.active=oracle,prod
spt:
  security:
    mode: JWT
  cors:
    allowed-origins: ${SPT_CORS_ORIGINS}
  agent:
    # prod uses the real LLM endpoint (SPT_LLM_ENDPOINT_URL, SPT_LLM_MODEL, SPT_LLM_AUTHORIZATION); no mock
    mock-endpoint: false

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPT_JWT_ISSUER_URI}

springdoc:
  api-docs:
    enabled: ${SPT_API_DOCS_ENABLED:false}
