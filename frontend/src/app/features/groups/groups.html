<div class="page">
  <div class="page-header">
    <div>
      <h1>Query Groups</h1>
      <div class="subtitle">{{ total() }} groups · same SQL with different WHERE filters, grouped by fingerprint. Click a row to see its log rows.</div>
    </div>
    <span class="spacer"></span>
    <button mat-stroked-button (click)="rebuild()" matTooltip="Re-fingerprint all logs (after changing fingerprint settings)">
      <mat-icon>refresh</mat-icon> Rebuild
    </button>
    <button mat-flat-button [disabled]="selected().length === 0" (click)="track(selected())">
      <mat-icon>playlist_add</mat-icon> Add {{ selected().length || '' }} to tracker
    </button>
  </div>

  <div class="panel">
    <form class="filters" (ngSubmit)="search()">
      <mat-form-field class="wide">
        <mat-label>SQL contains</mat-label>
        <input matInput name="q" [(ngModel)]="filter.q" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <mat-form-field>
        <mat-label>User</mat-label>
        <input matInput name="userId" [(ngModel)]="filter.userId" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Min group size</mat-label>
        <input matInput type="number" min="1" name="minGroupSize" [(ngModel)]="filter.minGroupSize" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Min avg duration (min)</mat-label>
        <input matInput type="number" min="0" name="minAvgDuration" [(ngModel)]="filter.minAvgDuration" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Tracked</mat-label>
        <mat-select name="tracked" [(ngModel)]="filter.tracked">
          <mat-option value="">All</mat-option>
          <mat-option value="true">On tracker</mat-option>
          <mat-option value="false">Not tracked</mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-stroked-button type="submit"><mat-icon>filter_alt</mat-icon> Apply</button>
    </form>

    <ag-grid-angular
      class="grid"
      [gridOptions]="gridOptions"
      [columnDefs]="columns"
      (gridReady)="onReady($event)"
      (rowClicked)="onRowClicked($event)"
      (selectionChanged)="onSelection()"
    />
  </div>
</div>
