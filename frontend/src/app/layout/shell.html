<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    [mode]="compact() ? 'over' : 'side'"
    [opened]="!compact()"
    class="sidenav"
    [attr.role]="compact() ? 'dialog' : 'navigation'"
  >
    <div class="brand">
      <mat-icon class="brand-icon">speed</mat-icon>
      <div>
        <div class="brand-name">SQL Tuning</div>
        <div class="brand-sub">Performance workbench</div>
      </div>
    </div>
    <mat-nav-list>
      @for (item of nav; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive"
          (click)="compact() && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
          <span matListItemLine class="hint">{{ item.hint }}</span>
        </a>
      }
    </mat-nav-list>
    <div class="engine-note">
      <mat-icon>bolt</mat-icon>
      <span>Use case: Impala</span>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (compact()) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle navigation">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="title">Impala SQL · Performance &amp; Tuning</span>
      <span class="spacer"></span>
      <button
        mat-icon-button
        (click)="theme.cycle()"
        [matTooltip]="'Theme: ' + theme.mode()"
        [attr.aria-label]="'Switch theme, current ' + theme.mode()"
      >
        <mat-icon>{{ themeIcon() }}</mat-icon>
      </button>
      <a mat-icon-button href="/swagger-ui.html" target="_blank" matTooltip="API documentation" aria-label="API docs">
        <mat-icon>api</mat-icon>
      </a>
    </mat-toolbar>
    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
